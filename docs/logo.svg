<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>

  <!-- Shield - thick solid stroke, no opacity tricks -->
  <path d="M128 28 L204 64 L204 146 C204 192 166 222 128 238 C90 222 52 192 52 146 L52 64 Z"
        fill="#0e1b30"
        stroke="#00d4ff"
        stroke-width="6"
        stroke-linejoin="round"/>

  <!-- Inner shield glow line -->
  <path d="M128 44 L190 74 L190 144 C190 184 160 210 128 224 C96 210 66 184 66 144 L66 74 Z"
        fill="none"
        stroke="#00d4ff"
        stroke-width="1.5"
        stroke-opacity="0.35"/>

  <!-- $ prompt symbol -->
  <text x="84" y="116"
        font-family="monospace"
        font-size="28"
        font-weight="bold"
        fill="#00d4ff">$_</text>

  <!-- Command line -->
  <line x1="120" y1="108" x2="180" y2="108"
        stroke="#00d4ff" stroke-width="4" stroke-linecap="round"/>

  <!-- Output line 1 -->
  <line x1="84" y1="140" x2="178" y2="140"
        stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

  <!-- Output line 2 -->
  <line x1="84" y1="162" x2="152" y2="162"
        stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

  <!-- Blinking cursor -->
  <rect x="157" y="154" width="8" height="16" rx="1" fill="#00d4ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Checkmark badge circle -->
  <circle cx="186" cy="186" r="28"
          fill="#0e1b30"
          stroke="#00d4ff"
          stroke-width="5"/>

  <!-- Checkmark -->
  <path d="M172 186 L182 196 L202 174"
        fill="none"
        stroke="#00d4ff"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
