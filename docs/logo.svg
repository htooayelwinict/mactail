<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3a7bd5" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="256"/>
    <line x1="80" y1="0" x2="80" y2="256"/>
    <line x1="120" y1="0" x2="120" y2="256"/>
    <line x1="160" y1="0" x2="160" y2="256"/>
    <line x1="200" y1="0" x2="200" y2="256"/>
    <line x1="0" y1="40" x2="256" y2="40"/>
    <line x1="0" y1="80" x2="256" y2="80"/>
    <line x1="0" y1="120" x2="256" y2="120"/>
    <line x1="0" y1="160" x2="256" y2="160"/>
    <line x1="0" y1="200" x2="256" y2="200"/>
  </g>

  <!-- Shield shape -->
  <path d="M128 36 L192 68 L192 140 C192 180 160 212 128 228 C96 212 64 180 64 140 L64 68 Z"
        fill="none" stroke="url(#shield)" stroke-width="3" filter="url(#glow)"/>
  <path d="M128 44 L184 72 L184 138 C184 174 156 204 128 218 C100 204 72 174 72 138 L72 72 Z"
        fill="url(#bg)" opacity="0.5"/>

  <!-- Terminal prompt lines inside shield -->
  <g filter="url(#glow)">
    <!-- $ prompt -->
    <text x="96" y="112" font-family="SF Mono, Menlo, monospace" font-size="16" font-weight="bold" fill="#00d2ff">$</text>
    <line x1="114" y1="108" x2="168" y2="108" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- tail line 1 -->
    <line x1="96" y1="130" x2="155" y2="130" stroke="#3a7bd5" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- tail line 2 -->
    <line x1="96" y1="148" x2="140" y2="148" stroke="#3a7bd5" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- blinking cursor -->
    <rect x="143" y="142" width="10" height="14" rx="1" fill="#00d2ff" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0;0.9" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Checkmark badge -->
  <g transform="translate(168, 168)">
    <circle r="22" fill="#0a0f1a" stroke="#00d2ff" stroke-width="2" opacity="0.9"/>
    <path d="M-9 0 L-3 6 L9 -6" fill="none" stroke="#00d2ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
</svg>
