[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mactail"
version = "0.1.0"
description = "Local-first macOS launchd persistence baselining & threat hunting"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "htooayelwinict" }]
keywords = ["macos", "launchd", "persistence", "threat-hunting", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
mactail = "mactail.cli.app:app"

[project.urls]
Homepage = "https://github.com/htooayelwinict/mactail"
Issues = "https://github.com/htooayelwinict/mactail/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mactail"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # typer Option defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]  # asserts are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["mactail"]
